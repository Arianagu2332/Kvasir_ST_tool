name: build-dist

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'util/**'
      - '@types/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'webpack.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.js'
      - '.github/workflows/build-dist.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit dist
        run: |
          if git diff --quiet -- dist; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          git commit -m "chore: rebuild dist"
          git push
