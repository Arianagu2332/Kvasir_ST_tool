<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kvasir 故事库编辑器</title>
  <style>
    :root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#202020;background:#f2f2ef}*{box-sizing:border-box}body{margin:0;padding:24px}.app{max-width:1100px;margin:auto;background:#fff;border:1px solid #d8d8d2;border-radius:14px;padding:22px;box-shadow:0 12px 40px #00000012}h1,h2,p{margin:0}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}header p{color:#6d6d6d;font-size:13px;margin-top:5px}.toolbar,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin-bottom:16px}.tabs{border-bottom:1px solid #ddd;padding-bottom:10px;margin-bottom:14px}button,.file{border:1px solid #cfcfc9;background:#f2f2ed;border-radius:8px;padding:9px 12px;cursor:pointer}.primary{background:#222;color:#fff;border-color:#222}.danger{color:#a43b3b;background:#fff}.file input{display:none}.workspace{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}.list{display:flex;flex-direction:column;gap:8px;max-height:680px;overflow:auto}.item{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:#fff;border:1px solid #d8d8d2;border-radius:9px;padding:11px}.item.selected{border-color:#222;box-shadow:inset 3px 0 #222}.item span{color:#6d6d6d;font-size:12px}.form{border:1px solid #d8d8d2;border-radius:10px;padding:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;color:#626262;font-size:12px}input,textarea,select{width:100%;font:inherit;padding:9px;border:1px solid #d0d0ca;border-radius:7px;background:#fff;color:#202020}textarea{resize:vertical;min-height:90px}.hidden{display:none}.status{min-height:22px;color:#4b765e;font-size:13px;margin-top:12px}@media(max-width:700px){body{padding:8px}.app{padding:14px}.workspace,.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="app">
  <header><div><h1>Kvasir 故事库编辑器</h1><p>编辑完成后导出 `library.json` 和 `manifest.json`，替换项目中的同名文件，再运行发布工具。</p></div><label class="file">打开 library.json<input id="open" type="file" accept="application/json"></label></header>
  <div class="toolbar"><button id="new" class="primary">新增条目</button><button id="exportLibrary">导出 library.json</button><button id="exportManifest">导出 manifest.json</button><button id="reset">载入空库</button></div>
  <div class="tabs"><button data-kind="au">AU库</button><button data-kind="if">IF线库</button><button data-kind="extra">番外库</button></div>
  <div class="workspace"><div id="list" class="list"></div><div id="editor" class="form"></div></div>
  <div id="status" class="status"></div>
</div>
<script>
const empty=()=>({schemaVersion:1,version:'0.1.0',updatedAt:new Date().toISOString(),au:[],if:[],extra:[]});
let library=empty(),kind='au',selected=-1;
const $=id=>document.getElementById(id);
function version(){const p=String(library.version||'0.1.0').split('.').map(Number);while(p.length<3)p.push(0);p[2]++;return p.join('.')}
function status(text){$('status').textContent=text}
function download(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function entries(){return library[kind]}
function renderList(){const list=$('list');list.innerHTML='';entries().forEach((entry,index)=>{const b=document.createElement('button');b.className='item'+(index===selected?' selected':'');b.innerHTML='<strong>'+escapeHtml(entry.title||'未命名条目')+'</strong><span>'+escapeHtml(entry.summary||entry.content||entry.world||entry.premise||'')+'</span>';b.onclick=()=>{selected=index;renderList();renderEditor()};list.appendChild(b)});if(!entries().length)list.innerHTML='<div style="color:#777;text-align:center;padding:30px">暂无条目</div>'}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function value(key, fallback=''){return selected>=0&&entries()[selected] ? entries()[selected][key]??fallback:fallback}
function renderEditor(){const e=$('editor');if(selected<0){e.innerHTML='<p style="color:#777">请选择条目，或点击“新增条目”。</p>';return}const extra=kind==='extra';e.innerHTML=`<h2>条目编辑</h2><label class="field">名称<input id="title" value="${escapeHtml(value('title'))}"></label>${extra?'<label class="field">小剧场内容<textarea id="content">'+escapeHtml(value('content'))+'</textarea></label><div class="grid"><label class="field">最低字数<input id="words" type="number" value="'+Number(value('defaultMinWords',8000))+'"></label><label class="field">默认 NSFW<select id="nsfw"><option>禁止</option><option>允许</option><option>必须</option></select></label></div>':'<label class="field">简介<input id="summary" value="'+escapeHtml(value('summary'))+'"></label><label class="field">'+(kind==='au'?'世界观':'IF前提')+'<textarea id="main">'+escapeHtml(value(kind==='au'?'world':'premise'))+'</textarea></label><label class="field">适配提示<textarea id="hints">'+escapeHtml(value('adaptationHints'))+'</textarea></label><label class="field">禁忌<textarea id="taboos">'+escapeHtml(value('taboos'))+'</textarea></label><label class="field">文风<input id="style" value="'+escapeHtml(value('style'))+'"></label>'}<div class="actions"><button id="save" class="primary">保存条目</button><button id="delete" class="danger">删除条目</button></div>`;if(extra)$('nsfw').value=value('defaultNsfw','禁止');$('save').onclick=saveEntry;$('delete').onclick=deleteEntry}
function saveEntry(){const e=entries()[selected];e.title=$('title').value.trim();if(kind==='extra'){e.content=$('content').value;e.defaultMinWords=Number($('words').value)||8000;e.defaultNsfw=$('nsfw').value;e.defaultStyles=e.defaultStyles||['幽默搞笑']}else{e.summary=$('summary').value;e[kind==='au'?'world':'premise']=$('main').value;e.adaptationHints=$('hints').value;e.taboos=$('taboos').value;e.style=$('style').value}library.updatedAt=new Date().toISOString();renderList();renderEditor();status('已保存，导出文件后替换项目中的库文件。')}
function deleteEntry(){if(selected<0)return;entries().splice(selected,1);selected=-1;renderList();renderEditor();status('条目已删除。')}
function newEntry(){const id='official-'+kind+'-'+Date.now();entries().push(kind==='au'?{id,type:'au',title:'新 AU',summary:'',world:'',adaptationHints:'',taboos:'',style:''}:kind==='if'?{id,type:'if',title:'新 IF',summary:'',premise:'',adaptationHints:'',taboos:'',style:''}:{id,type:'extra',title:'新番外',content:'',defaultMinWords:8000,defaultNsfw:'禁止',defaultStyles:['幽默搞笑']});selected=entries().length-1;renderList();renderEditor()}
$('new').onclick=newEntry;document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;selected=-1;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('primary',x===b));renderList();renderEditor()});$('open').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{library={...empty(),...JSON.parse(reader.result)};selected=-1;renderList();renderEditor();status('已打开故事库。')}catch{status('打开失败：JSON 格式无效。')}};reader.readAsText(file)};$('exportLibrary').onclick=()=>{library.version=version();library.updatedAt=new Date().toISOString();download('library.json',JSON.stringify(library,null,2));status('已导出 library.json，版本 '+library.version)};$('exportManifest').onclick=()=>{download('manifest.json',JSON.stringify({schemaVersion:1,version:library.version,updatedAt:new Date().toISOString(),library:'library.json'},null,2));status('已导出 manifest.json')};$('reset').onclick=()=>{library=empty();selected=-1;renderList();renderEditor();status('已载入空库')};renderList();renderEditor();document.querySelector('[data-kind="au"]').classList.add('primary');
</script>
</body>
</html>
